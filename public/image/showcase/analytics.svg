<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="card4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadowSoft" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#f59e0b" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <!-- Connection lines -->
  <g stroke="#fde68a" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6">
    <line x1="200" y1="90" x2="100" y2="160"/>
    <line x1="200" y1="90" x2="300" y2="160"/>
    <line x1="100" y1="160" x2="200" y2="230"/>
    <line x1="300" y1="160" x2="200" y2="230"/>
    <line x1="100" y1="160" x2="300" y2="160"/>
  </g>
  <!-- Center data hub -->
  <g filter="url(#shadowSoft)">
    <rect x="160" y="60" width="80" height="60" rx="12" fill="url(#card1)" opacity="0.9"/>
    <text x="200" y="85" font-family="Arial, sans-serif" font-size="20" fill="#fff" font-weight="800" text-anchor="middle">98</text>
    <text x="200" y="103" font-family="Arial, sans-serif" font-size="10" fill="#fff" font-weight="600" text-anchor="middle" opacity="0.9">综合得分</text>
  </g>
  <!-- Top-left card: bar chart mini -->
  <g filter="url(#shadowSoft)">
    <rect x="40" y="140" width="120" height="80" rx="12" fill="#fff" opacity="0.95"/>
    <text x="100" y="162" font-family="Arial, sans-serif" font-size="10" fill="#92400e" font-weight="700" text-anchor="middle">课件使用量</text>
    <rect x="56" y="172" width="16" height="34" rx="3" fill="url(#card1)"/>
    <rect x="80" y="165" width="16" height="41" rx="3" fill="url(#card2)"/>
    <rect x="104" y="178" width="16" height="28" rx="3" fill="url(#card4)"/>
  </g>
  <!-- Top-right card: trend line mini -->
  <g filter="url(#shadowSoft)">
    <rect x="240" y="140" width="120" height="80" rx="12" fill="#fff" opacity="0.95"/>
    <text x="300" y="162" font-family="Arial, sans-serif" font-size="10" fill="#92400e" font-weight="700" text-anchor="middle">学情趋势</text>
    <polyline points="258,195 270,186 282,190 294,175 306,180 318,168 330,172" fill="none" stroke="url(#card3)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="258" cy="195" r="3" fill="#f87171"/>
    <circle cx="282" cy="190" r="3" fill="#f87171"/>
    <circle cx="306" cy="180" r="3" fill="#f87171"/>
    <circle cx="330" cy="172" r="3" fill="#f87171"/>
  </g>
  <!-- Bottom-center card: pie chart mini -->
  <g filter="url(#shadowSoft)">
    <rect x="130" y="210" width="140" height="65" rx="12" fill="#fff" opacity="0.95"/>
    <text x="200" y="230" font-family="Arial, sans-serif" font-size="10" fill="#92400e" font-weight="700" text-anchor="middle">资源分布</text>
    <circle cx="178" cy="250" r="14" fill="none" stroke="url(#card1)" stroke-width="6" stroke-dasharray="22 66"/>
    <circle cx="178" cy="250" r="14" fill="none" stroke="url(#card2)" stroke-width="6" stroke-dasharray="18 70" stroke-dashoffset="-22"/>
    <circle cx="178" cy="250" r="14" fill="none" stroke="url(#card3)" stroke-width="6" stroke-dasharray="12 76" stroke-dashoffset="-40"/>
    <rect x="205" y="242" width="8" height="8" rx="2" fill="url(#card1)"/>
    <text x="217" y="250" font-family="Arial, sans-serif" font-size="8" fill="#92400e">课件</text>
    <rect x="205" y="254" width="8" height="8" rx="2" fill="url(#card2)"/>
    <text x="217" y="262" font-family="Arial, sans-serif" font-size="8" fill="#92400e">教案</text>
    <rect x="245" y="242" width="8" height="8" rx="2" fill="url(#card3)"/>
    <text x="257" y="250" font-family="Arial, sans-serif" font-size="8" fill="#92400e">题库</text>
  </g>
  <!-- Decorative dots -->
  <circle cx="30" cy="45" r="4" fill="#fbbf24" opacity="0.35"/>
  <circle cx="370" cy="35" r="3" fill="#f97316" opacity="0.3"/>
  <circle cx="375" cy="265" r="5" fill="#f59e0b" opacity="0.2"/>
  <circle cx="25" cy="270" r="3" fill="#fbbf24" opacity="0.25"/>
</svg>
