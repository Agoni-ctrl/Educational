<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="cardPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cardViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cardPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardSpark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="shadowSoft" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#8b5cf6" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowGlow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#667eea" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <!-- Connection lines -->
  <g stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5">
    <line x1="200" y1="90" x2="95" y2="165"/>
    <line x1="200" y1="90" x2="305" y2="165"/>
    <line x1="95" y1="165" x2="200" y2="230"/>
    <line x1="305" y1="165" x2="200" y2="230"/>
  </g>
  <!-- Center: AI Spark / Brain -->
  <g filter="url(#shadowGlow)">
    <rect x="152" y="55" width="96" height="70" rx="16" fill="url(#cardSpark)" opacity="0.92"/>
    <!-- Sparkle icon -->
    <text x="200" y="82" font-family="Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle">✦</text>
    <text x="200" y="105" font-family="Arial, sans-serif" font-size="11" fill="#fff" font-weight="700" text-anchor="middle" opacity="0.9">AI 备课</text>
  </g>
  <!-- Top-left card -->
  <g filter="url(#shadowSoft)">
    <rect x="30" y="140" width="130" height="70" rx="12" fill="#fff" opacity="0.95"/>
    <rect x="42" y="152" width="28" height="28" rx="8" fill="url(#cardPurple)"/>
    <text x="56" y="170" font-family="Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle">📋</text>
    <text x="78" y="163" font-family="Arial, sans-serif" font-size="13" fill="#4c1d95" font-weight="700">教学大纲</text>
    <text x="78" y="180" font-family="Arial, sans-serif" font-size="9" fill="#8b5cf6">自动生成课程框架</text>
    <rect x="42" y="190" width="106" height="2" rx="1" fill="url(#cardPurple)" opacity="0.3"/>
  </g>
  <!-- Top-right card -->
  <g filter="url(#shadowSoft)">
    <rect x="240" y="140" width="130" height="70" rx="12" fill="#fff" opacity="0.95"/>
    <rect x="252" y="152" width="28" height="28" rx="8" fill="url(#cardViolet)"/>
    <text x="266" y="170" font-family="Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle">🎯</text>
    <text x="288" y="163" font-family="Arial, sans-serif" font-size="13" fill="#4c1d95" font-weight="700">课堂活动</text>
    <text x="288" y="180" font-family="Arial, sans-serif" font-size="9" fill="#8b5cf6">互动环节设计</text>
    <rect x="252" y="190" width="106" height="2" rx="1" fill="url(#cardViolet)" opacity="0.3"/>
  </g>
  <!-- Bottom-center card -->
  <g filter="url(#shadowSoft)">
    <rect x="115" y="222" width="170" height="55" rx="12" fill="#fff" opacity="0.95"/>
    <rect x="127" y="234" width="28" height="28" rx="8" fill="url(#cardPink)"/>
    <text x="141" y="252" font-family="Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle">📄</text>
    <text x="163" y="245" font-family="Arial, sans-serif" font-size="13" fill="#4c1d95" font-weight="700">课件 &amp; 教案同步产出</text>
    <text x="163" y="262" font-family="Arial, sans-serif" font-size="9" fill="#8b5cf6">智能排版，一键导出</text>
  </g>
  <!-- Decorative dots -->
  <circle cx="32" cy="50" r="4" fill="#a78bfa" opacity="0.3"/>
  <circle cx="370" cy="38" r="3" fill="#818cf8" opacity="0.25"/>
  <circle cx="378" cy="275" r="4" fill="#c4b5fd" opacity="0.2"/>
  <circle cx="22" cy="262" r="3" fill="#a78bfa" opacity="0.2"/>
</svg>
