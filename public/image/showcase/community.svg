<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="bubble1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="bubble2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="bubble3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="avatar1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="avatar2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="avatar3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0ea5e9" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowAvatar" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0ea5e9" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <!-- Connection lines between people -->
  <g stroke="#99f6e4" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5">
    <line x1="110" y1="120" x2="200" y2="170"/>
    <line x1="200" y1="170" x2="290" y2="120"/>
    <line x1="110" y1="120" x2="290" y2="120"/>
    <line x1="200" y1="170" x2="105" y2="220"/>
    <line x1="200" y1="170" x2="295" y2="220"/>
  </g>
  <!-- Speech Bubble 1 (top-left) -->
  <g filter="url(#shadow)">
    <path d="M80,90 Q80,65 110,65 L170,65 Q200,65 200,90 L200,105 Q200,115 190,115 L130,115 L110,135 L115,115 L80,115 Q80,115 80,105 Z" fill="url(#bubble1)" opacity="0.85"/>
    <text x="120" y="92" font-family="Arial, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">教学心得</text>
  </g>
  <!-- Speech Bubble 2 (top-right) -->
  <g filter="url(#shadow)">
    <path d="M200,90 Q200,65 230,65 L290,65 Q320,65 320,90 L320,105 Q320,115 310,115 L270,115 L290,135 L265,115 L200,115 Q200,115 200,105 Z" fill="url(#bubble2)" opacity="0.85"/>
    <text x="260" y="92" font-family="Arial, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">资源分享</text>
  </g>
  <!-- Speech Bubble 3 (bottom) -->
  <g filter="url(#shadow)">
    <path d="M120,195 Q120,175 150,175 L210,175 Q240,175 240,195 L240,205 Q240,215 230,215 L190,215 L210,235 L185,215 L120,215 Q120,215 120,205 Z" fill="url(#bubble3)" opacity="0.85"/>
    <text x="180" y="202" font-family="Arial, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">在线研讨</text>
  </g>
  <!-- People Avatars -->
  <!-- Avatar 1 (top center) -->
  <g filter="url(#shadowAvatar)">
    <circle cx="200" cy="170" r="18" fill="url(#avatar1)"/>
    <circle cx="200" cy="163" r="7" fill="#fff" opacity="0.9"/>
    <ellipse cx="200" cy="181" rx="9" ry="5" fill="#fff" opacity="0.7"/>
  </g>
  <!-- Avatar 2 (top-left) -->
  <g filter="url(#shadowAvatar)">
    <circle cx="110" cy="120" r="16" fill="url(#avatar2)"/>
    <circle cx="110" cy="114" r="6" fill="#fff" opacity="0.9"/>
    <ellipse cx="110" cy="130" rx="8" ry="4.5" fill="#fff" opacity="0.7"/>
  </g>
  <!-- Avatar 3 (top-right) -->
  <g filter="url(#shadowAvatar)">
    <circle cx="290" cy="120" r="16" fill="url(#avatar3)"/>
    <circle cx="290" cy="114" r="6" fill="#fff" opacity="0.9"/>
    <ellipse cx="290" cy="130" rx="8" ry="4.5" fill="#fff" opacity="0.7"/>
  </g>
  <!-- Avatar 4 (bottom-left) -->
  <g filter="url(#shadowAvatar)">
    <circle cx="105" cy="220" r="15" fill="url(#avatar1)"/>
    <circle cx="105" cy="214" r="5.5" fill="#fff" opacity="0.9"/>
    <ellipse cx="105" cy="229" rx="7.5" ry="4" fill="#fff" opacity="0.7"/>
  </g>
  <!-- Avatar 5 (bottom-right) -->
  <g filter="url(#shadowAvatar)">
    <circle cx="295" cy="220" r="15" fill="url(#avatar2)"/>
    <circle cx="295" cy="214" r="5.5" fill="#fff" opacity="0.9"/>
    <ellipse cx="295" cy="229" rx="7.5" ry="4" fill="#fff" opacity="0.7"/>
  </g>
  <!-- Small decorative dots -->
  <circle cx="48" cy="55" r="4" fill="#38bdf8" opacity="0.3"/>
  <circle cx="370" cy="45" r="3" fill="#2dd4bf" opacity="0.25"/>
  <circle cx="355" cy="270" r="5" fill="#818cf8" opacity="0.2"/>
  <circle cx="35" cy="250" r="3" fill="#38bdf8" opacity="0.2"/>
</svg>
